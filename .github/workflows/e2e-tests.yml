name: E2E Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Cucumber wiring
        run: npm run test:dry-run
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
      - name: Run Cucumber scenarios
        run: npm test -- --format json:reports/cucumber-report.json
      - name: Upload Cucumber report and failure diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-results
          path: reports/
          retention-days: 14
